name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL for testing (default: http://localhost:3000)'
        required: false
        default: 'http://localhost:3000'

jobs:
  test:
    runs-on: ubuntu-latest
    
    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'http://localhost:3000' }}
      NODE_ENV: test
      # 确保CI环境使用Mock模式
      GEMINI_API_KEY: ''

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install Playwright browsers
      run: npx playwright install --with-deps
    
    - name: Create .env.local for Mock mode
      run: |
        echo "GEMINI_API_KEY=" > .env.local
        echo "GEMINI_MODEL=gemini-2.5-flash" >> .env.local
        echo "BASE_URL=${{ env.BASE_URL }}" >> .env.local
        echo "NODE_ENV=test" >> .env.local
    
    - name: Run tests
      run: npm run test:all
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-${{ github.run_number }}
        path: |
          test-results/
          playwright-report/
        retention-days: 30
    
    - name: Upload Playwright HTML report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-html-report-${{ github.run_number }}
        path: test-results/html/
        retention-days: 30
    
    - name: Check test results
      if: failure()
      run: |
        echo "Tests failed. Check the uploaded reports for details."
        echo "Base URL used: ${{ env.BASE_URL }}"
        exit 1


