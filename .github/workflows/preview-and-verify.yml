name: Preview Deploy and Verify

on:
  push:
    branches-ignore:
      - main
      - master
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (default: current)'
        required: false
        default: ''

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npm run prep

      - name: Setup Vercel
        run: |
          npm install -g vercel@latest
          echo "VERCEL_TOKEN configured: ${{ secrets.VERCEL_TOKEN != '' }}"
          echo "VERCEL_ORG_ID configured: ${{ secrets.VERCEL_ORG_ID != '' }}"
          echo "VERCEL_PROJECT_ID configured: ${{ secrets.VERCEL_PROJECT_ID != '' }}"

      - name: Deploy to Vercel
        id: deploy
        run: |
          # 尝试从现有配置获取项目信息
          if [ -f ".vercel/project.json" ]; then
            echo "Using existing .vercel/project.json"
            DEPLOY_OUTPUT=$(vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes 2>&1)
          else
            echo "No existing project config, creating new deployment"
            DEPLOY_OUTPUT=$(vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes 2>&1)
          fi
          
          echo "=== Deploy Output ==="
          echo "$DEPLOY_OUTPUT"
          echo "===================="
          
          # 解析 Preview URL - 多种模式匹配
          PREVIEW_URL=""
          
          # 模式1: 标准 vercel.app 域名
          PREVIEW_URL=$(echo "$DEPLOY_OUTPUT" | grep -o 'https://[^[:space:]]*\.vercel\.app' | head -1)
          
          # 模式2: 自定义域名或其他格式
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL=$(echo "$DEPLOY_OUTPUT" | grep -o 'https://[^[:space:]]*\.vercel\.app' | head -1)
          fi
          
          # 模式3: 从 JSON 输出解析
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL=$(echo "$DEPLOY_OUTPUT" | grep -o '"url":"[^"]*"' | sed 's/"url":"//;s/"//' | head -1)
          fi
          
          if [ -n "$PREVIEW_URL" ]; then
            echo "✅ Preview URL found: $PREVIEW_URL"
            echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
            echo "DEPLOY_URL=$PREVIEW_URL" >> $GITHUB_OUTPUT
            echo "BASE_URL=$PREVIEW_URL" >> $GITHUB_OUTPUT
          else
            echo "❌ Failed to parse Preview URL from deploy output"
            echo "preview_url=" >> $GITHUB_OUTPUT
            echo "DEPLOY_URL=" >> $GITHUB_OUTPUT
            echo "BASE_URL=" >> $GITHUB_OUTPUT
            echo "Deploy output for debugging:"
            echo "$DEPLOY_OUTPUT"
            exit 1
          fi

      - name: Wait for deployment
        run: |
          if [ -n "${{ steps.deploy.outputs.preview_url }}" ]; then
            echo "⏳ Waiting for deployment to be ready..."
            sleep 20
            echo "🔍 Checking deployment health..."
            for i in {1..3}; do
              if curl -f -s "${{ steps.deploy.outputs.preview_url }}/api/health" > /dev/null; then
                echo "✅ Health check passed on attempt $i"
                break
              else
                echo "⚠️ Health check failed on attempt $i, waiting..."
                sleep 10
              fi
            done
          fi

      - name: Run tests on Preview URL
        if: steps.deploy.outputs.preview_url != ''
        env:
          BASE_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          echo "🧪 Running tests on: ${{ steps.deploy.outputs.preview_url }}"
          echo "BASE_URL set to: $BASE_URL"
          npm run test:all

      - name: Run tests locally (fallback)
        if: steps.deploy.outputs.preview_url == ''
        run: |
          echo "⚠️ No Preview URL, running tests locally"
          npm run test:all

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            const botComment = comments.find(comment => comment.user.type === 'Bot' && comment.body.includes('Preview Deploy'));
            
            const commentBody = `🚀 **Preview Deploy Complete**
            
            **Preview URL:** ${{ steps.deploy.outputs.preview_url || 'Deployment failed' }}
            
            **Test Status:** ${{ job.status }}
            
            📊 [Download Test Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)
            
            ---
            *Auto-generated by Preview Deploy workflow*`;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody,
              });
            }
